name: Demo

on:
  push:
    branches: [main]
    paths: ['src/**', 'example-expo/**', '.github/workflows/demo.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: example-expo/package-lock.json
      - run: npm ci
        working-directory: example-expo
      - run: npx expo export --platform web --output-dir dist
        working-directory: example-expo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: example-expo/dist
      - id: deployment
        uses: actions/deploy-pages@v4
